name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование и деплой
        run: |
          # Клонируем репозиторий ИЗ ВЕТКИ gh-pages
          git clone -b gh-pages https://github.com/Nootropica/LR4_RPP.git
          cd LR4_RPP
          
          # ОТЛАДКА: смотрим что в репозитории
          echo "=== Текущая папка ==="
          pwd
          echo "=== Содержимое ==="
          ls -la
          echo "=== Все файлы рекурсивно ==="
          find . -type f -name "*.html" | head -20
          echo "=== Конец отладки ==="
          
          # Создаем версионную папку
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p release/v$VERSION
          cp -r ru en index.html release/v$VERSION/
          
          # Публикуем
          git config --global user.name "Автоматический CI/CD"
          git config --global user.email "mogucci2000@list.ru"
          cp -r release/* .
          git add .
          git commit -m "Deploy v$VERSION"
          git push origin gh-pages