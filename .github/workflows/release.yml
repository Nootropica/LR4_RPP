name: Deploy Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          
      - name: Создание версионной папки
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Убираем 'v' если он есть в начале
          mkdir -p $VERSION
          cp -r ru en index.html $VERSION/
          
      - name: Публикация
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Deploy v$VERSION"
          git push